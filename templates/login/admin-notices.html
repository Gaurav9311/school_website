<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Notices</title>
    <!-- Bootstrap 5 CSS + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-navy: #0f172a;
            --accent-indigo: #4f46e5;
            --accent-soft: #e0e7ff;
            --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #eef2ff 50%, #f8fafc 100%);
            --border-color: #cbd5e1;
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        body {
            background: var(--bg-gradient);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            color: var(--text-dark);
            padding-bottom: 40px;
            min-height: 100vh;
        }

        .header-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .page-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary-navy);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-title i {
            color: #ffffff;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            padding: 12px 16px;
            border-radius: 14px;
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.3);
        }

        .btn-back-link {
            background: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-dark);
            padding: 9px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.875rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        .btn-back-link:hover {
            background: var(--primary-navy);
            color: #ffffff;
            border-color: var(--primary-navy);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }

        .custom-card {
            background: #ffffff;
            border-radius: 22px;
            padding: 28px;
            border: 1px solid var(--border-color);
            box-shadow: 0 15px 35px -5px rgba(15, 23, 42, 0.06);
            margin-bottom: 24px;
        }

        .card-header-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--primary-navy);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-header-title i {
            font-size: 1.2rem;
        }

        .form-label-custom {
            font-size: 0.775rem;
            font-weight: 800;
            color: var(--primary-navy);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .form-control {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-dark);
            background-color: #ffffff;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: var(--accent-indigo);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }

        /* Grid Table Styling */
        .table-responsive {
            border-radius: 14px;
            overflow-x: auto;
            box-shadow: 0 0 0 1px var(--border-color);
        }

        .table-custom {
            margin-bottom: 0;
            width: 100%;
            font-size: 0.85rem;
            border-collapse: collapse;
        }

        .table-custom th,
        .table-custom td {
            border: 1px solid var(--border-color) !important;
            padding: 13px 16px;
            vertical-align: middle;
        }

        .table-custom thead th {
            background: linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%);
            font-weight: 800;
            color: var(--primary-navy);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-size: 0.775rem;
        }

        .table-custom tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .table-custom tbody tr:hover td {
            background-color: #e0e7ff;
        }

        .btn-delete {
            background-color: #ffe4e6;
            color: #e11d48;
            border: 1px solid #fca5a5;
            font-weight: 800;
            font-size: 0.775rem;
            padding: 6px 14px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-delete:hover {
            background-color: #e11d48;
            color: #ffffff;
            border-color: #e11d48;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
            transform: translateY(-1px);
        }

        .btn-submit-notice {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            color: #ffffff;
            font-weight: 800;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            transition: all 0.2s ease;
        }

        .btn-submit-notice:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
        }
    </style>
</head>
<body>

    <div class="container-fluid px-4">

        <!-- Top Navigation & Title -->
        <div class="header-section">
            <h1 class="page-title">
                <i class="fa-solid fa-bullhorn"></i> Admin Panel - Notice Board
            </h1>
            <a href="/dashboard.html" class="btn-back-link">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>

        <!-- Notice Add Form -->
        <div class="custom-card">
            <h5 class="card-header-title">
                <i class="fa-solid fa-pen-to-square text-indigo"></i> Publish New Notice
            </h5>
            <form action="/admin/notices/add" method="POST">
                <div class="mb-3">
                    <label class="form-label-custom">Notice Title</label>
                    <input type="text" name="title" class="form-control" placeholder="Enter notice title..." required>
                </div>
                <div class="mb-3">
                    <label class="form-label-custom">Notice Details / Content</label>
                    <textarea name="content" class="form-control" rows="4" placeholder="Write notice details here..." required></textarea>
                </div>
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-submit-notice btn-sm px-4 py-2 text-white">
                        <i class="fa-solid fa-paper-plane me-1"></i> Publish Notice
                    </button>
                </div>
            </form>
        </div>

        <!-- Notices List Table -->
        <div class="custom-card">
            <h5 class="card-header-title">
                <i class="fa-solid fa-list-check text-indigo"></i> All Published Notices
            </h5>
            <div class="table-responsive">
                <table class="table align-middle table-custom">
                    <thead>
                        <tr>
                            <th width="140">Date</th>
                            <th width="260">Title</th>
                            <th>Content</th>
                            <th width="120" class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for notice in notices %}
                        <tr>
                            <td class="text-muted fw-bold">{{ notice[3] }}</td>
                            <td class="fw-bold text-dark">{{ notice[1] }}</td>
                            <td style="white-space: pre-wrap; line-height: 1.5;" class="fw-medium">{{ notice[2] }}</td>
                            <td class="text-center">
                                <a href="/admin/notices/delete/{{ notice[0] }}" class="btn-delete" onclick="return confirm('Delete this notice?')">
                                    <i class="fa-solid fa-trash-can"></i> Delete
                                </a>
                            </td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="4" class="text-center text-muted fw-bold py-4">
                                <i class="fa-solid fa-folder-open me-1"></i> No notices found.
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
