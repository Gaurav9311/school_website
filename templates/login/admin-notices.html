<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Notices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="mb-4">Admin Panel - Notice Board</h2>

        <!-- Notice Add Form -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3">Publish New Notice</h5>
                <form action="/admin/notices/add" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Notice Title</label>
                        <input type="text" name="title" class="form-control" placeholder="Enter notice title..." required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notice Details / Content</label>
                        <textarea name="content" class="form-control" rows="4" placeholder="Write notice details here..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Publish Notice</button>
                </form>
            </div>
        </div>

        <!-- Notices List Table -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-3">All Published Notices</h5>
                <div class="table-responsive">
                    <table class="table table-bordered align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Date</th>
                                <th>Title</th>
                                <th>Content</th>
                                <th width="100">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for notice in notices %}
                            <tr>
                                <td>{{ notice[3] }}</td>
                                <td class="fw-bold">{{ notice[1] }}</td>
                                <td style="white-space: pre-wrap;">{{ notice[2] }}</td>
                                <td>
                                    <a href="/admin/notices/delete/{{ notice[0] }}" class="btn btn-danger btn-sm" onclick="return confirm('Delete this notice?')">Delete</a>
                                </td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="4" class="text-center text-muted">No notices found.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
