<div class="mt-0">
<section class="section student-admission-form py-4">
    <div class="container">
        <div class="row">
            <div class="col-lg-10 mx-auto">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h3 class="mb-0 text-center">Student Registration & Detail Form</h3>
                    </div>
                    <div class="card-body p-4">
                        <form id="fullStudentForm" action="/add_new_student" method="POST">

                            <!-- 1. ACADEMIC & ADMISSION DETAILS -->
                            <h5 class="text-primary mb-3"><i class="bi bi-book"></i> Academic Details</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-3">
                                    <label class="form-label font-weight-bold">Academic Session *</label>
                                    <select name="academic_session" class="form-select" required>
                                        <option value="">Select Session</option>
                                        <option>2025-26</option>
                                        <option>2026-27</option>
                                        <option>2027-28</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Admission No.</label>
                                    <input type="text" name="admission_no" class="form-control" placeholder="Auto / Manual">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Admission Date *</label>
                                    <input type="date" name="admission_date" class="form-control" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Class Seeking *</label>
                                    <select name="class" class="form-select" required>
                                        <option value="">Select Class</option>
                                        <option>Nursery</option>
                                        <option>LKG</option>
                                        <option>UKG</option>
                                        <option>Class 1</option>
                                        <option>Class 2</option>
                                        <option>Class 3</option>
                                        <option>Class 4</option>
                                        <option>Class 5</option>
                                        <option>Class 6</option>
                                        <option>Class 7</option>
                                        <option>Class 8</option>
                                        <option>Class 9</option>
                                        <option>Class 10</option>
                                        <option>Class 11</option>
                                        <option>Class 12</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Section</label>
                                    <select name="section" class="form-select">
                                        <option value="">Select Section</option>
                                        <option>A</option>
                                        <option>B</option>
                                        <option>C</option>
                                        <option>D</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Roll Number</label>
                                    <input type="text" name="roll_no" class="form-control">
                                </div>
                            </div>

                            <hr>

                            <!-- 2. STUDENT PERSONAL DETAILS -->
                            <h5 class="text-primary mb-3"><i class="bi bi-person"></i> Student Personal Details</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <label class="form-label">First Name *</label>
                                    <input type="text" name="first_name" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Middle Name</label>
                                    <input type="text" name="middle_name" class="form-control">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Last Name *</label>
                                    <input type="text" name="last_name" class="form-control" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Date of Birth *</label>
                                    <input type="date" name="date_of_birth" class="form-control" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Gender *</label>
                                    <select name="gender" class="form-select" required>
                                        <option value="">Select Gender</option>
                                        <option>Male</option>
                                        <option>Female</option>
                                        <option>Other</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Blood Group</label>
                                    <select name="blood_group" class="form-select">
                                        <option value="">Select</option>
                                        <option>A+</option>
                                        <option>A-</option>
                                        <option>B+</option>
                                        <option>B-</option>
                                        <option>O+</option>
                                        <option>O-</option>
                                        <option>AB+</option>
                                        <option>AB-</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Category</label>
                                    <select name="category" class="form-select">
                                        <option value="">Select Category</option>
                                        <option>General</option>
                                        <option>OBC</option>
                                        <option>SC</option>
                                        <option>ST</option>
                                        <option>EWS</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Religion</label>
                                    <select name="religion" class="form-select">
                                        <option value="">Select Religion</option>
                                        <option>Hindu</option>
                                        <option>Muslim</option>
                                        <option>Sikh</option>
                                        <option>Christian</option>
                                        <option>Jain</option>
                                        <option>Buddhist</option>
                                        <option>Other</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Mother Tongue</label>
                                    <input type="text" name="mother_tongue" class="form-control" placeholder="Hindi, English, etc.">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Nationality</label>
                                    <input type="text" name="nationality" class="form-control" value="Indian">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Aadhaar Number</label>
                                    <input type="text" name="aadhaar_number" maxlength="12" class="form-control">
                                </div>
                            </div>

                            <hr>

                            <!-- 3. PARENTS & GUARDIAN DETAILS -->
                            <h5 class="text-primary mb-3"><i class="bi bi-people"></i> Parents & Guardian Details</h5>
                            <div class="row g-3 mb-4">
                                <!-- Father Details -->
                                <div class="col-md-4">
                                    <label class="form-label">Father's Name *</label>
                                    <input type="text" name="father_name" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Father's Occupation</label>
                                    <input type="text" name="father_occupation" class="form-control">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Father's Phone Number *</label>
                                    <input type="tel" name="father_phone" maxlength="10" class="form-control" required>
                                </div>

                                <!-- Mother Details -->
                                <div class="col-md-4">
                                    <label class="form-label">Mother's Name *</label>
                                    <input type="text" name="mother_name" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Mother's Occupation</label>
                                    <input type="text" name="mother_occupation" class="form-control">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Mother's Phone Number</label>
                                    <input type="tel" name="mother_phone" maxlength="10" class="form-control">
                                </div>

                                <!-- Common Guardian / Contact Info -->
                                <div class="col-md-4">
                                    <label class="form-label">Parent Email ID</label>
                                    <input type="email" name="parent_email" class="form-control">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Annual Family Income</label>
                                    <input type="text" name="annual_income" class="form-control">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Emergency Contact Person & No.</label>
                                    <input type="text" name="emergency_contact" class="form-control" placeholder="Name & Mobile">
                                </div>
                            </div>

                            <hr>

                            <!-- 4. ADDRESS DETAILS (PERMANENT & PRESENT) -->
                            <h5 class="text-primary mb-3"><i class="bi bi-geo-alt"></i> Address Details</h5>
                            
                            <!-- Present / Temporary Address -->
                            <h6 class="text-secondary font-weight-bold">Present / Current Address (Non-Permanent)</h6>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Street Address / House No. *</label>
                                    <input type="text" name="present_address" class="form-control" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">City *</label>
                                    <input type="text" name="present_city" class="form-control" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">State *</label>
                                    <input type="text" name="present_state" class="form-control" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Pincode *</label>
                                    <input type="text" name="present_pincode" maxlength="6" class="form-control" required>
                                </div>
                            </div>

                            <!-- Permanent Address -->
                            <h6 class="text-secondary font-weight-bold">Permanent Address</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Street Address / House No. *</label>
                                    <input type="text" name="permanent_address" class="form-control" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">City *</label>
                                    <input type="text" name="permanent_city" class="form-control" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">State *</label>
                                    <input type="text" name="permanent_state" class="form-control" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Pincode *</label>
                                    <input type="text" name="permanent_pincode" maxlength="6" class="form-control" required>
                                </div>
                            </div>

                            <hr>

                            <!-- 5. PREVIOUS ACADEMIC DETAILS -->
                            <h5 class="text-primary mb-3"><i class="bi bi-journal-bookmark"></i> Previous Academic History</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-5">
                                    <label class="form-label">Previous School Name</label>
                                    <input type="text" name="previous_school_name" class="form-control">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Previous Class</label>
                                    <input type="text" name="previous_class" class="form-control">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Percentage / Grade</label>
                                    <input type="text" name="previous_marks" class="form-control">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">TC Number</label>
                                    <input type="text" name="tc_number" class="form-control">
                                </div>
                            </div>

                            <!-- SUBMIT BUTTONS -->
                            <div class="col-12 text-end mt-4">
                                <button type="button" class="btn btn-outline-primary" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i> Back</button>
                                <button type="reset" class="btn btn-outline-secondary me-2">Reset Form</button>
                                <button type="submit" class="btn btn-primary px-4">Submit Student Details</button>

                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

    <script>
document.addEventListener("DOMContentLoaded", function () {
    const dropdowns = document.querySelectorAll('.custom-navbar .nav-item.dropdown');
    const submenus = document.querySelectorAll('.dropdown-submenu > a');

    // Main dropdown click logic (Desktop click-lock & switch)
    dropdowns.forEach(dropdown => {
        const toggleBtn = dropdown.querySelector('.dropdown-toggle');
        
        if (toggleBtn) {
            toggleBtn.addEventListener('click', function (e) {
                e.preventDefault();
                
                const isAlreadyClicked = dropdown.classList.contains('js-clicked');

                // Baaki saare dropdowns ko close kar dein
                dropdowns.forEach(item => {
                    item.classList.remove('js-clicked');
                    item.classList.remove('show');
                });

                if (!isAlreadyClicked) {
                    dropdown.classList.add('js-clicked');
                }
            });
        }
    });

    // Submenu click support (Khas taur par Mobile/Touch devices ke liye)
    submenus.forEach(subToggle => {
        subToggle.addEventListener('click', function (e) {
            if (window.innerWidth < 992) { // Sirf mobile/tablet par
                e.preventDefault();
                e.stopPropagation();
                
                const parentSubmenu = this.closest('.dropdown-submenu');
                const subMenu = parentSubmenu.querySelector('.dropdown-menu');
                
                if (subMenu) {
                    const isVisible = subMenu.style.display === 'block';
                    // Baaki submenus hide karein
                    parentSubmenu.parentElement.querySelectorAll('.dropdown-menu').forEach(m => {
                        if (m !== subMenu) m.style.display = 'none';
                    });
                    subMenu.style.display = isVisible ? 'none' : 'block';
                }
            }
        });
    });

    // Navbar ke bahar kahin bhi click karne par sabhi menus band ho jayein
    document.addEventListener('click', function (e) {
        if (!e.target.closest('.custom-navbar')) {
            dropdowns.forEach(dropdown => {
                dropdown.classList.remove('js-clicked');
                dropdown.classList.remove('show');
            });
        }
    });
});

    <script>
        $(document).ready(function () {
            $('#studentForm').on('submit', function (e) {
                e.preventDefault();

                $.ajax({
                    url: $(this).attr('action'),
                    type: 'POST',
                    data: new FormData(this),
                    processData: false,
                    contentType: false,
                    success: function (response) {
                        if (response && response.success) {
                            toastr.success(response.message || 'Student data submitted successfully');
                            // Apply custom color styling if provided
                            if (response.color) {
                                $('.toast.toast-success').css('background-color', response.color);
                            }
                            setTimeout(function () {
                                window.location.reload();
                            }, 1200);
                        } else {
                            toastr.error(response.message || 'Failed to submit student data');
                            // Apply custom error color if provided
                            if (response.color) {
                                $('.toast.toast-error').css('background-color', response.color);
                            }
                        }
                    },
                    error: function () {
                        toastr.error('Failed to submit student data');
                        $('.toast.toast-error').css('background-color', '#ff6b6b');
                    }
                });
            });
        });
    </script>
