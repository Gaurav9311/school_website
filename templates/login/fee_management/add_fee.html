<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Collection Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .fee-card {
            background: #f8f8fa;
            border-radius: 5px;
            box-shadow: 0 5px 35px rgba(53, 27, 126, 0.76);
            max-width: 500px;
            width: 100%;
            margin: 50px auto;
        }
        .form-title {
            font-size: 40px;
            font-weight: 700;
            text-align: center;
            color: #0a0a0a;
            margin-bottom: 20px;
        }
        .form-label {
            font-weight: 600;
            color: #0c0c0cfb;
            font-size: 0.95rem;
            margin-bottom: 4px;
        }
        .form-control, .form-select {
            border: none;
            border-bottom: 2px solid #070707;
            border-radius: 0;
            box-shadow: none !important;
            background: transparent !important;
            color: #0e0e0e !important;
            transition: .3s;
        }
        .form-control::placeholder {
            color: #999999;
        }
        .form-control:focus, .form-select:focus {
            border-color: #a0a0a0;
            box-shadow: none;
        }
        .btn-collect-fee {
            background-color: #01860c;
            color: #ffffff;
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            margin-left: 10px;
            border-radius: 10px;
            padding: 10px;
            width: 50%;
            transition: background-color 0.2s;
        }
        .btn-collect-fee:hover {
            background-color: #e04b00;
            color: #ffffff;
        }
        select option {
            background-color: #0d47a1;
            color: white;
        }
        .btn-secondary {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            padding: 10px;
            width: 40%;
            transition: background-color 0.2s;
        }
    </style>
</head>
<body>
    <div class="card fee-card p-4">
        <h2 class="form-title">Fee Collection Form</h2>
        
        <!-- Original action preserved -->
        <form action="/add_fee" method="POST">
            <div class="mb-3">
                <label for="studentId" class="form-label">Student ID</label>
                <input name="student_id" type="text" class="form-control" id="studentId" placeholder="Enter Student ID" required>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label for="studentName" class="form-label">Student Name</label>
                    <!-- Fixed: type changed from number to text -->
                    <input name="student_name" type="text" class="form-control" id="studentName" placeholder="Enter Name" required>
                </div>
                <div class="col-6">
                    <label for="classSection" class="form-label">Section</label>
                    <!-- Fixed: type changed from number to text -->
                    <input name="section" type="text" class="form-control" id="classSection" placeholder="e.g. A" required>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label for="classSelect" class="form-label">Class</label>
                    <select name="class" id="classSelect" class="form-select" required>
                        <option value="">Select Class</option>
                        <option value="Nursery">Nursery</option>
                        <option value="LKG">LKG</option>
                        <option value="UKG">UKG</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                    </select>
                </div>
                <div class="col-6">
                    <label for="feeMonth" class="form-label">Fee Month</label>
                    <select name="fee_month" id="feeMonth" class="form-select month-select" required>
                        <option value="">Select Month</option>
                        <option value="January 2026">January 2026</option>
                        <option value="February 2026">February 2026</option>
                        <option value="March 2026">March 2026</option>
                        <option value="April 2026">April 2026</option>
                        <option value="May 2026">May 2026</option>
                        <option value="June 2026">June 2026</option>
                        <option value="July 2026">July 2026</option>
                        <option value="August 2026">August 2026</option>
                        <option value="September 2026">September 2026</option>
                        <option value="October 2026">October 2026</option>
                        <option value="November 2026">November 2026</option>
                        <option value="December 2026">December 2026</option>
                    </select>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label for="totalFee" class="form-label">Total Fee</label>
                    <input name="total_fee" type="number" step="any" class="form-control" id="totalFee" placeholder="0.00" required>
                </div>
                <div class="col-6">
                    <label for="paidAmount" class="form-label">Paid Amount</label>
                    <input name="paid_amount" type="number" step="any" class="form-control" id="paidAmount" placeholder="0.00" required>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label for="paymentMode" class="form-label">Payment Mode</label>
                    <select name="payment_mode" class="form-select" id="paymentMode" required>
                        <option value="" disabled selected>Select Mode</option>
                        <option value="Cash">Cash</option>
                        <option value="UPI">UPI</option>
                        <option value="Bank">Bank</option>
                    </select>
                </div>

                <div class="col-6">
                    <label for="paymentDate" class="form-label">Payment Date</label>
                    <input name="payment_date" type="date" class="form-control" id="paymentDate" required>
                </div>
            </div>

            <!-- Original href link preserved -->
            <div class="d-flex justify-content-between align-items-center mt-4">
                <a href="/fee.html" class="btn btn-secondary">Back</a>
                <button type="submit" class="btn btn-collect-fee">Collect Fee</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
