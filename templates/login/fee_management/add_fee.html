<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Collection Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Card form layout matching the uploaded image */
        .fee-card {
            background: #f8f8fa;
            border-radius: 5px;
            box-shadow: 0 5px 35px rgba(53, 27, 126, 0.76);
            max-width: 500px;
            width: 100%;
            margin: 50px auto;
            /* border: 1px solid #e1e8ed; */
        }
        .form-title {
            font-size: 40px;
            font-weight: 700;
            text-align: center;
            color: #0a0a0a;
            margin-bottom: 20px;
        }
        /* Label & Input tweaks matching image style */
        .form-label {
            font-weight: 600;
            color: #0c0c0cfb;
            font-size: 0.95rem;
            margin-bottom: 4px;
        }
        .form-control, .form-select {
            /* border: 1px solid #cccccc;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 0.95rem;
            color: #495057;
             */
            /* width: 420px; */
            border:none;
            border-bottom:2px solid #070707;
            border-radius:0;
            box-shadow:none !important;
            background:transparent !important;
            /* background: none; */
            color: #0e0e0e83 !important; /* Blue background par text white dikhe */
            transition:.3s;
        }
        
        .form-control::placeholder {
            color: #999999;
        }
        .form-control:focus, .form-select:focus {
            border-color: #a0a0a0;
            box-shadow: none;
        }
        
        /* Balance read-only grey background field */
        .balance-field {
            background-color: none !important;
            border-bottom: 2px solid #cccccc;
        }
        /* Exact Orange Button Style matching the design */
        .btn-collect-fee {
            background-color: #01860c;
            color: #ffffff;
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            margin-left: 10px;
            border-radius: 10px;
            padding: 10px;
            width: 50%;
            transition: background-color 0.2s;
        }
        .btn-collect-fee:hover {
            background-color: #e04b00;
            color: #ffffff;
        }
        select{
            background-color: #0d47a1;
            color: white;
        }

        select option{
            background-color: #0d47a1;
            color: white;
        }
        .btn{
            
            /* background-color: #ff5500; */
            color: #ffffff;
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            margin-left: 10px;
            border-radius: 10px;
            padding: 10px;
            width: 50%;
            transition: background-color 0.2s;
        }

    </style>
</head>
<body>
    <div class="card fee-card p-4">
        <h2 class="form-title">Fee Collection Form</h2>
        
        <form action="/add_fee" method="POST">
            <div class="mb-3">
                <label for="studentId" class="form-label">Student ID</label>
                <input name = "student_id" type="text" class="form-control" id="studentId" placeholder="Input Field">
            </div>

            <div class="mb-3">
                <label for="studentName" class="form-label">Student Name</label>
                <input name = "student_name" type="text" class="form-control" id="studentName" placeholder="Input Field">
            </div>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label for="classSelect" class="form-label">Class</label>
                    <select name="class" class="form-select" required>
                        <option value="">Select Class</option>

                        <option value="Nursery">Nursery</option>
                        <option value="LKG">LKG</option>
                        <option value="UKG">UKG</option>

                        <option value="Class 1">Class 1</option>
                        <option value="Class 2">Class 2</option>
                        <option value="Class 3">Class 3</option>
                        <option value="Class 4">Class 4</option>
                        <option value="Class 5">Class 5</option>

                        <option value="Class 6">Class 6</option>
                        <option value="Class 7">Class 7</option>
                        <option value="Class 8">Class 8</option>

                        <option value="Class 9">Class 9</option>
                        <option value="Class 10">Class 10</option>

                        <option value="Class 11">Class 11</option>
                        <option value="Class 12">Class 12</option>
                    </select>
                </div>
                <div class="col-6">
                    <label for="feeMonth" class="form-label">Fee Month</label>
                    <select name="fee_month" class="form-select month-select" required >
                        <option value="">Select Month</option>

                        <option value="January">January</option>
                        <option value="February">February</option>
                        <option value="March">March</option>
                        <option value="April">April</option>
                        <option value="May">May</option>
                        <option value="June">June</option>
                        <option value="July">July</option>
                        <option value="August">August</option>
                        <option value="September">September</option>
                        <option value="October">October</option>
                        <option value="November">November</option>
                        <option value="December">December</option>
                    </select>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label for="totalFee" class="form-label">Total Fee</label>
                    <input name = "total_fee" type="number" class="form-control" id="totalFee">
                </div>
                <div class="col-6">
                    <label for="paidAmount" class="form-label">Paid Amount</label>
                    <input name = "paid_amount" type="number" class="form-control" id="paidAmount">
                </div>
            </div>

            
            <!-- <div class="row g-3 mb-3">
                <div class="col-6">
                    <label for="totalFee" class="form-label">Year</label>
                    <input type="year" class="form-control">
                </div>
                <div class="col-6">
                    <label for="paidAmount" class="form-label">Paid Amount</label>
                    <input type="number" class="form-control" id="paidAmount">
                </div>
            </div> -->

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label for="paymentMode" class="form-label">Payment Mode</label>
                    <select name="payment_mode" class="form-select" id="paymentMode">
                        <option selected>Cash / UPI / Bank</option>
                        <option value="cash">Cash</option>
                        <option value="upi">UPI</option>
                        <option value="bank">Bank</option>
                    </select>
                </div>

                <div class="col-6">
                    <label for="paymentDate" class="form-label">Payment Date</label>
                    <input name = "payment_date" type="date" class="form-control" id="paymentDate">
                </div>
            </div>
            <a href="/fee.html" class="btn btn-secondary" style="width: 40%;">Back</a>
            <button type="submit" class="btn btn-collect-fee">Collect Fee</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
