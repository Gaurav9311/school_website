<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Collection Form</title>
    
    <!-- Bootstrap 5 CSS + Icons + Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .fee-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 20px 25px -5px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
            max-width: 540px;
            width: 100%;
            padding: 2.25rem;
        }

        .header-box {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header-icon {
            width: 54px;
            height: 54px;
            background-color: #eff6ff;
            color: #2563eb;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .form-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin: 0;
        }

        .form-label {
            font-weight: 600;
            color: #475569;
            font-size: 0.825rem;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .form-control, .form-select {
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 0.65rem 0.9rem;
            font-size: 0.925rem;
            color: #0f172a;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .form-control:focus, .form-select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
            background-color: #ffffff;
        }

        .select-dark-option option {
            background-color: #ffffff;
            color: #0f172a;
        }

        .btn-action-wrap {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 1.75rem;
        }

        .btn-secondary-custom {
            background-color: #ffffff;
            color: #475569;
            border: 1px solid #cbd5e1;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 10px;
            padding: 0.7rem 1.25rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            width: 35%;
        }

        .btn-secondary-custom:hover {
            background-color: #f8fafc;
            color: #0f172a;
            border-color: #94a3b8;
        }

        .btn-collect-fee {
            background-color: #16a34a;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid #16a34a;
            border-radius: 10px;
            padding: 0.7rem 1.25rem;
            width: 65%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-collect-fee:hover {
            background-color: #15803d;
            border-color: #15803d;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
        }
    </style>
</head>
<body>
    <div class="fee-card">
        <div class="header-box">
            <div class="header-icon">
                <i class="bi bi-wallet2"></i>
            </div>
            <h2 class="form-title">Fee Collection Form</h2>
        </div>
        
        <!-- Original action preserved -->
        <form action="/add_fee" method="POST">
            <div class="mb-3">
                <label for="studentId" class="form-label">Student ID</label>
                <input name="student_id" type="text" class="form-control" id="studentId" placeholder="Enter Student ID" required>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label for="studentName" class="form-label">Student Name</label>
                    <input name="student_name" type="text" class="form-control" id="studentName" placeholder="Enter Name" required>
                </div>
                <div class="col-6">
                    <label for="classSection" class="form-label">Section</label>
                    <input name="section" type="text" class="form-control" id="classSection" placeholder="e.g. A" required>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label for="classSelect" class="form-label">Class</label>
                    <select name="class" id="classSelect" class="form-select select-dark-option" required>
                        <option value="">Select Class</option>
                        <option value="Nursery">Nursery</option>
                        <option value="LKG">LKG</option>
                        <option value="UKG">UKG</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                    </select>
                </div>
                <div class="col-6">
                    <label for="feeMonth" class="form-label">Fee Month</label>
                    <select name="fee_month" id="feeMonth" class="form-select select-dark-option" required>
                        <option value="">Select Month</option>
                        <option value="January 2026">January 2026</option>
                        <option value="February 2026">February 2026</option>
                        <option value="March 2026">March 2026</option>
                        <option value="April 2026">April 2026</option>
                        <option value="May 2026">May 2026</option>
                        <option value="June 2026">June 2026</option>
                        <option value="July 2026">July 2026</option>
                        <option value="August 2026">August 2026</option>
                        <option value="September 2026">September 2026</option>
                        <option value="October 2026">October 2026</option>
                        <option value="November 2026">November 2026</option>
                        <option value="December 2026">December 2026</option>
                    </select>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label for="totalFee" class="form-label">Total Fee</label>
                    <input name="total_fee" type="number" step="any" class="form-control" id="totalFee" placeholder="0.00" required>
                </div>
                <div class="col-6">
                    <label for="paidAmount" class="form-label">Paid Amount</label>
                    <input name="paid_amount" type="number" step="any" class="form-control" id="paidAmount" placeholder="0.00" required>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label for="paymentMode" class="form-label">Payment Mode</label>
                    <select name="payment_mode" class="form-select select-dark-option" id="paymentMode" required>
                        <option value="" disabled selected>Select Mode</option>
                        <option value="Cash">Cash</option>
                        <option value="UPI">UPI</option>
                        <option value="Bank">Bank</option>
                    </select>
                </div>

                <div class="col-6">
                    <label for="paymentDate" class="form-label">Payment Date</label>
                    <input name="payment_date" type="date" class="form-control" id="paymentDate" required>
                </div>
            </div>

            <!-- Original href link preserved -->
            <div class="btn-action-wrap">
                <a href="/fee.html" class="btn-secondary-custom">
                    <i class="bi bi-arrow-left"></i> Back
                </a>
                <button type="submit" class="btn-collect-fee">
                    <i class="bi bi-check-circle-fill"></i> Collect Fee
                </button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
